---
layout: default
---
<section id="hero" class="hero">
    <video class="hero__video" autoplay muted loop playsinline poster="{{ '/assets/img/site/hero-poster.jpg' | relative_url }}">
        <source src="{{ '/assets/video/hero.mp4' | relative_url }}" type="video/mp4">
    </video>
    <div class="hero__overlay"></div>
    <div class="hero__container">
        <div class="hero__title-wrap">
            <p class="hero__kicker" data-split="load">Designer &amp; Educator</p>
            <h1 class="hero__name" data-split="load" data-delay="120">SUDHAKAR NADKARNI</h1>
        </div>
    </div>
</section>
<div class="home-main">
{{ content }}
</div>
