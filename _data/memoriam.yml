events:
  - id: iitg
    venue: Department of Design, IIT Guwahati
    title: Tribute Gathering
    date: 22 October 2026
    date_note: Working date from the photographs; to be confirmed
    caption: Students, faculty and alumni gathered in the department courtyard, signed the condolence book and planted a tree in his memory.
    photos: [iitg-01, iitg-02, iitg-03, iitg-04, iitg-05, iitg-06, iitg-07, iitg-08, iitg-09, iitg-10, iitg-11, iitg-12, iitg-13, iitg-14, iitg-15, iitg-16, iitg-17, iitg-18, iitg-19, iitg-20, iitg-21]
  - id: idc
    venue: IDC School of Design, IIT Bombay
    title: Condolence Meeting
    date: 27 October 2026
    date_note: From the IDC announcement email
    youtube: OXhmiUgUYuc
    youtube_title: "Prof. Sudhakar Nadkarni : Condolence Meeting"
    youtube_channel: IDC School of Design - Open Seminars
    caption: Words shared by colleagues, faculty and family at the meeting.
    photos: [idc-01, idc-02, idc-03, idc-04, idc-05, idc-06, idc-07]
  - id: pune
    venue: ADI and the IDC Alumni, Pune
    title: Remembering Prof. Sudhakar Nadkarni
    date: 31 October 2026, 5:00–7:00 pm
    place: Bajaj Gallery, 5th Floor, MCCIA Trade Tower, 403-A Senapati Bapat Road, Pune
    caption: "We are deeply saddened by the passing of Prof. Sudhakar Nadkarni. Affectionately known as ‘Nadu’ to generations of students, he dedicated his life selflessly to design education and the design profession, leaving behind a legacy for which we will remain forever grateful. ADI and the IDC Alumni invite you to join us in a remembrance meeting to honour his life, his contributions, and the lasting impact he has had on all of us."
    credit: "Poster photograph: Prof. Sudesh Balan, IDC"
    photos: [pune-poster, pune-01, pune-02, pune-03, pune-04, pune-05, pune-06, pune-07, pune-08, pune-09, pune-10, pune-11, pune-12]

