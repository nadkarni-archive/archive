<footer class="ft mt-auto">
    <section class="cta">
        <img class="cta__img" src="{{ '/assets/img/site/workshop-collage.jpg' | relative_url }}" alt="" aria-hidden="true">
        <div class="cta__overlay"></div>
        <div class="cta__gradient"></div>
        <div class="cta__container">
            <div class="cta__box">
                <h2 class="cta__heading" data-split>Write to Professor Nadkarni</h2>
                <h2 class="cta__email" data-split data-delay="300">snadkarni36@gmail.com</h2>
                <button type="button" data-appear="fade" style="--m-delay:420ms" class="cta__copy" data-email="snadkarni36@gmail.com">Copy Email ID</button>
            </div>
        </div>
    </section>
    <div class="ft__bottom">
        <div class="ft__container">
            <span class="ft__line" aria-hidden="true"></span>
            <div class="ft__row">
                <p>©Collins Assisi® 2027, All Rights Reserved</p>
                <p><a href="https://nishitanirmal.vercel.app/">Designed with love, by Nishita Nirmal</a></p>
            </div>
        </div>
    </div>
</footer>
<script>
document.querySelectorAll('.cta__copy').forEach(function(b){
    b.addEventListener('click', function(){
        var done = function(){ b.textContent = 'Copied!'; setTimeout(function(){ b.textContent = 'Copy Email ID'; }, 2000); };
        if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.email).then(done, function(){});
    });
});
</script>
